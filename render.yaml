services:
  - type: web
    name: pos-system
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: pos-uploads
      mountPath: /var/www/html/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Pos_System
      # SYNC_TOKEN is intentionally NOT given a value here. It used to ship with a
      # hardcoded literal that is published in this repository, which meant anyone
      # could authenticate as a store. Set it to a random 32+ character value in the
      # Render Dashboard (Environment), matching the offline till's SYNC_TOKEN.
      # Generate one with: php -r "echo bin2hex(random_bytes(32)), PHP_EOL;"
      - key: SYNC_TOKEN
        sync: false
      # ── Platform Super Admin ────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: ENABLE_SUPER_ADMIN
        value: "true"
      - key: PLATFORM_ENC_KEY
        sync: false          # Set manually in Render dashboard — never commit
                          # Generate with: php -r "echo base64_encode(random_bytes(32)).PHP_EOL;"
                          # Crypto also accepts the older PLATFORM_CRYPTO_KEY name.
      - key: PLATFORM_SESSION_PATH
        value: /tmp/procast_super_sess
      - key: PLATFORM_TIMEZONE
        value: Asia/Manila
