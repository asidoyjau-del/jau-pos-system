services:
  - type: web
    name: pos-system
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: pos-uploads
      mountPath: /var/www/html/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Pos_System
      - key: SYNC_TOKEN
        value: procast_sync_key
      # ── Platform Super Admin ────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: ENABLE_SUPER_ADMIN
        value: "true"
      - key: PLATFORM_ENC_KEY
        sync: false          # Set manually in Render dashboard — never commit
                          # Generate with: php -r "echo base64_encode(random_bytes(32)).PHP_EOL;"
                          # Crypto also accepts the older PLATFORM_CRYPTO_KEY name.
      - key: PLATFORM_SESSION_PATH
        value: /tmp/procast_super_sess
      - key: PLATFORM_TIMEZONE
        value: Asia/Manila
